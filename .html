<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXORA WALLS | Wallpaper Beyond the Screen</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & Babel CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }
    .animate-fadeIn { animation: fadeIn 0.25s ease-out forwards; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #020617; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 9999px; border: 2px solid #020617; }
    ::-webkit-scrollbar-thumb:hover { background: #06b6d4; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans selection:bg-cyan-500 selection:text-black">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const SEED_WALLPAPERS = [
      {
        id: 'nx-001',
        name: 'Cyberpunk Metropolis Horizon',
        thumbnail_url: 'https://images.unsplash.com/photo-1519501025264-65ba15a82390?auto=format&fit=crop&w=1200&q=80',
        image_url: 'https://images.unsplash.com/photo-1519501025264-65ba15a82390?auto=format&fit=crop&w=3840&q=100',
        category: 'Cyberpunk',
        resolution: '3840x2160',
        format: 'PNG',
        file_size: '14.8 MB',
        aspect_ratio: '16:9',
        description: 'A glowing futuristic skyline immersed in neon pink and electric blue rain.',
        featured: true
      },
      {
        id: 'nx-002',
        name: 'Cosmic Nebula Odyssey',
        thumbnail_url: 'https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=1200&q=80',
        image_url: 'https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=3840&q=100',
        category: 'Sci-Fi',
        resolution: '7680x4320',
        format: 'PNG',
        file_size: '22.4 MB',
        aspect_ratio: '16:9',
        description: 'An expansive 8K render of deep space nebulae weaving through distant planetary systems.',
        featured: true
      },
      {
        id: 'nx-003',
        name: 'Ronin Blade Beneath Cherry Blossoms',
        thumbnail_url: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=1200&q=80',
        image_url: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=3840&q=100',
        category: 'Anime',
        resolution: '3840x2160',
        format: 'PNG',
        file_size: '12.1 MB',
        aspect_ratio: '16:9',
        description: 'Cinematic anime artwork featuring a lone samurai warrior under sakura petals.'
      }
    ];

    const CATEGORIES = ['All', 'Anime', 'Gaming', 'Fantasy', 'Sci-Fi', 'Nature', 'Cars', 'Cyberpunk', 'Minimal', 'Dark', 'Movies', 'Superheroes', 'Abstract'];

    function App() {
      const [category, setCategory] = useState('All');
      const [search, setSearch] = useState('');
      const [viewerIndex, setViewerIndex] = useState(null);

      const filteredWallpapers = useMemo(() => {
        return SEED_WALLPAPERS.filter(w => {
          const matchCat = category === 'All' || w.category === category;
          const matchSearch = !search || w.name.toLowerCase().includes(search.toLowerCase());
          return matchCat && matchSearch;
        });
      }, [category, search]);

      const handleDownload = (wallpaper) => {
        const link = document.createElement('a');
        link.href = wallpaper.image_url;
        link.download = `${wallpaper.name}.png`;
        link.target = '_blank';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const featured = SEED_WALLPAPERS[0];

      return (
        <div className="min-h-screen flex flex-col">
          {/* Navbar */}
          <header className="fixed top-0 left-0 right-0 z-40 bg-slate-950/80 backdrop-blur-xl border-b border-cyan-500/20 py-4 px-6 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <span className="text-xl font-extrabold tracking-widest text-white font-mono">
                NEXORA<span className="text-cyan-400">.</span>WALLS
              </span>
            </div>
            <div className="flex items-center gap-2">
              <input
                type="text"
                placeholder="Search..."
                value={search}
                onChange={(e) => setSearch(e.target.value)}
                className="bg-slate-900 border border-slate-800 text-xs px-3 py-1.5 rounded-xl text-white focus:outline-none focus:border-cyan-500"
              />
            </div>
          </header>

          {/* Hero Banner */}
          <section className="pt-28 pb-8 px-6 max-w-7xl mx-auto w-full">
            <div className="relative rounded-3xl overflow-hidden border border-slate-800 bg-slate-900/60 p-8 shadow-2xl">
              <div className="max-w-xl space-y-3">
                <span className="px-3 py-1 rounded-full bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 text-xs font-mono">
                  FEATURED WALLPAPER
                </span>
                <h1 className="text-3xl font-extrabold text-white">{featured.name}</h1>
                <p className="text-slate-300 text-xs">{featured.description}</p>
                <button onClick={() => setViewerIndex(0)} className="bg-gradient-to-r from-cyan-500 to-indigo-600 text-white font-bold px-6 py-2.5 rounded-xl text-xs">
                  View Wallpaper
                </button>
              </div>
            </div>
          </section>

          {/* Gallery */}
          <section className="max-w-7xl mx-auto w-full px-6 py-6 space-y-6">
            <div className="flex items-center gap-2 overflow-x-auto pb-2">
              {CATEGORIES.map(cat => (
                <button
                  key={cat}
                  onClick={() => setCategory(cat)}
                  className={`px-3.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-all ${
                    category === cat ? 'bg-cyan-500 text-black font-bold' : 'bg-slate-900 border border-slate-800 text-slate-300'
                  }`}
                >
                  {cat}
                </button>
              ))}
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
              {filteredWallpapers.map((w, index) => (
                <div key={w.id} className="group relative rounded-2xl overflow-hidden bg-slate-900 border border-slate-800">
                  <div className="aspect-[16/10] overflow-hidden cursor-pointer" onClick={() => setViewerIndex(index)}>
                    <img src={w.thumbnail_url} alt={w.name} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
                  </div>
                  <div className="p-4 flex items-center justify-between">
                    <div>
                      <h3 className="text-sm font-bold text-white truncate">{w.name}</h3>
                      <p className="text-xs text-slate-400 font-mono">{w.category} • {w.resolution}</p>
                    </div>
                    <button onClick={() => handleDownload(w)} className="p-2 bg-slate-950 border border-slate-800 rounded-xl text-cyan-400">
                      ⬇
                    </button>
                  </div>
                </div>
              ))}
            </div>
          </section>

          {/* Fullscreen Lightbox Viewer */}
          {viewerIndex !== null && (
            <div className="fixed inset-0 z-50 bg-slate-950/95 flex items-center justify-center p-6">
              <button onClick={() => setViewerIndex(null)} className="absolute top-6 right-6 text-white text-xl bg-slate-900 p-2.5 rounded-full">
                ✕
              </button>
              <div className="max-w-4xl w-full text-center space-y-4">
                <img src={SEED_WALLPAPERS[viewerIndex].image_url} className="max-h-[75vh] mx-auto rounded-2xl border border-slate-800" />
                <h2 className="text-xl font-bold text-white">{SEED_WALLPAPERS[viewerIndex].name}</h2>
                <button onClick={() => handleDownload(SEED_WALLPAPERS[viewerIndex])} className="bg-cyan-500 text-black font-extrabold px-8 py-3 rounded-2xl text-xs">
                  DOWNLOAD ORIGINAL 4K
                </button>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="mt-auto bg-slate-950 border-t border-slate-800 py-8 px-6 text-center text-xs text-slate-500 font-mono">
            <p>© 2026 NEXORA WALLS. All rights reserved. Free high-quality wallpapers for your desktop.</p>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
